<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>304 — three-nought-four</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Playfair+Display:wght@600&display=swap');
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --wood-a:#3a1c14; --wood-b:#1c0d09;
  --felt-a:#0f5a3c; --felt-b:#063421;
  --gold:#e3c565; --gold-d:#a5822f;
  --cream:#f6f1e2; --ink:#1a160f; --red:#b12b2b;
  --txt:#f3ead6; --dim:#c9b48a; --line:#5a3d2e;
  --serif:'Playfair Display',Georgia,serif;
  --display:'Cinzel',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:inherit}
html,body{margin:0;height:100%}
body{
  background:linear-gradient(160deg,var(--wood-a),var(--wood-b));
  color:var(--txt); font-family:var(--sans);
  display:flex; flex-direction:column; overflow:hidden;
}
/* ---------- tableau de score ---------- */
#scorebar{
  display:flex; align-items:stretch; gap:8px; padding:8px 10px;
  background:linear-gradient(180deg,#241009,#160a06);
  border-bottom:1px solid var(--line); flex-shrink:0;
}
.team{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px;
  background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; padding:5px 6px;}
.team .tlabel{font-family:var(--serif); font-size:11px; color:var(--dim); letter-spacing:.5px}
.team .tcount{font-family:var(--display); font-weight:800; font-size:22px; line-height:1; color:var(--gold)}
.team.ew .tcount{color:#e0c07a}
.tbar{width:100%; height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden}
.tbar span{display:block; height:100%; width:50%; background:linear-gradient(90deg,var(--gold-d),var(--gold)); border-radius:3px; transition:width .5s}
.center{display:flex; gap:10px; align-items:center; justify-content:center; padding:0 4px}
.center .stat{text-align:center; min-width:44px}
.center .k{font-family:var(--serif); font-size:9px; letter-spacing:.6px; color:var(--dim); text-transform:uppercase}
.center .v{font-family:var(--display); font-weight:800; font-size:17px; color:var(--txt); line-height:1.1}
#targets{display:flex; justify-content:space-between; padding:4px 14px; font-size:11px; color:var(--dim);
  background:#160a06; border-bottom:1px solid var(--line); flex-shrink:0}
#targets b{color:var(--gold); font-family:var(--display)}
/* ---------- table ---------- */
#table{
  position:relative; flex:1; min-height:0; margin:8px; border-radius:20px;
  background:radial-gradient(ellipse 120% 90% at 50% 45%,var(--felt-a),var(--felt-b) 78%);
  box-shadow:inset 0 0 0 3px var(--gold-d), inset 0 0 0 10px #0a3a26, inset 0 0 40px rgba(0,0,0,.55),
             0 8px 24px rgba(0,0,0,.5);
  overflow:hidden;
}
#table::before{content:""; position:absolute; inset:16px; border-radius:50%/40%;
  border:1px solid rgba(227,197,101,.18); pointer-events:none}
#trumpBadge{position:absolute; top:10px; left:12px; z-index:6; font-size:12px; color:var(--txt);
  background:rgba(0,0,0,.4); border:1px solid var(--gold-d); border-radius:20px; padding:4px 10px; font-family:var(--serif)}
#trumpBadge .hidden{color:var(--dim)}
/* ---------- pods joueurs ---------- */
.seat{position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px; transition:opacity .2s}
.pod{display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.32); border:1px solid var(--line);
  border-radius:22px; padding:3px 9px 3px 3px}
.avatar{width:30px; height:30px; border-radius:50%; flex-shrink:0;
  background:radial-gradient(circle at 35% 30%,#2a3a52,#141b28); border:2px solid var(--gold-d);
  display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:14px; color:var(--gold)}
.who{display:flex; flex-direction:column; line-height:1.05}
.who .name{font-family:var(--serif); font-size:12px; color:var(--txt)}
.who .meta{font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.4px}
.who .meta.tm{color:var(--gold); font-weight:700}
.who .meta.out{color:#e0866a}
.seat.active .avatar{border-color:var(--gold); box-shadow:0 0 0 2px rgba(227,197,101,.5), 0 0 16px rgba(227,197,101,.5); animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(227,197,101,.4),0 0 10px rgba(227,197,101,.35)}50%{box-shadow:0 0 0 3px rgba(227,197,101,.7),0 0 20px rgba(227,197,101,.65)}}
#seat-N{top:6px; left:50%; transform:translateX(-50%)}
#seat-E{right:6px; top:46%; transform:translateY(-50%)}
#seat-W{left:6px; top:46%; transform:translateY(-50%)}
#seat-S{bottom:2px; left:0; width:100%}
#seat-S .pod{position:absolute; left:10px; bottom:6px}
.handrow{display:flex; justify-content:center; align-items:flex-end}
#seat-N .handrow{margin-top:2px}
#seat-E .handrow,#seat-W .handrow{flex-direction:column; align-items:center}
#seat-S .handrow{padding-bottom:6px; min-height:86px}
/* ---------- cartes ---------- */
.card{width:46px; height:66px; border-radius:7px; background:linear-gradient(160deg,#fff,var(--cream));
  color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.45); position:relative; user-select:none; border:1px solid rgba(0,0,0,.12);
  font-family:Georgia,serif;}
.card .r{font-size:17px; line-height:1; font-weight:700}
.card .s{font-size:15px; line-height:1}
.card.big{width:52px; height:74px}
.card.big .r{font-size:19px}.card.big .s{font-size:17px}
.card.mini{width:24px; height:34px; border-radius:5px}
.card.red{color:var(--red)}
.card.back,.card.facedown{color:transparent}
.card.back{background:
  repeating-linear-gradient(45deg,#7a1f1f,#7a1f1f 4px,#5e1414 4px,#5e1414 8px); border:1px solid #3a0d0d;
  box-shadow:inset 0 0 0 3px rgba(227,197,101,.35),0 2px 5px rgba(0,0,0,.4)}
.card.facedown{background:repeating-linear-gradient(45deg,#8a6a2e,#8a6a2e 4px,#6b5122 4px,#6b5122 8px);
  border:1px solid #4a370f; box-shadow:inset 0 0 0 2px rgba(227,197,101,.4),0 2px 6px rgba(0,0,0,.45)}
.card.play{cursor:pointer; transition:transform .12s, box-shadow .12s}
.card.play:hover,.card.play:active{transform:translateY(-14px) scale(1.04)!important; box-shadow:0 10px 18px rgba(0,0,0,.5); z-index:99!important}
.card.disabled{filter:grayscale(.5) brightness(.82)}
.card.enter{animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.7); opacity:0}to{transform:scale(1); opacity:1}}
/* ---------- pli central ---------- */
#trick{position:absolute; top:50%; left:50%; transform:translate(-50%,-52%); width:170px; height:150px}
#trick .slot{position:absolute; width:52px; height:74px}
#trick .slot.S{bottom:0; left:50%; transform:translateX(-50%)}
#trick .slot.N{top:0; left:50%; transform:translateX(-50%)}
#trick .slot.E{right:0; top:50%; transform:translateY(-50%)}
#trick .slot.W{left:0; top:50%; transform:translateY(-50%)}
/* ---------- panneau bas ---------- */
#panel{background:linear-gradient(180deg,#1c0f09,#140a06); border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); flex-shrink:0; max-height:40vh; overflow-y:auto}
#msg{font-size:13px; color:var(--dim); margin-bottom:8px; min-height:18px; line-height:1.45}
#msg b{color:var(--txt)}
.btnrow{display:flex; gap:8px; flex-wrap:wrap}
button{font-family:var(--sans); font-size:14px; font-weight:600; border-radius:9px; padding:9px 15px;
  border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--txt); cursor:pointer; transition:.12s}
button:hover{border-color:var(--gold-d)}
button.primary{background:linear-gradient(180deg,#2f8f5e,#1f6e46); border-color:#2f8f5e; color:#fff}
button.gold{background:linear-gradient(180deg,var(--gold),var(--gold-d)); border-color:var(--gold); color:#2a1c06; font-weight:800}
button.pass{background:transparent}
button:disabled{opacity:.4; cursor:default}
.hint{font-size:11px; color:var(--dim); margin-top:8px; line-height:1.4}
#log{margin-top:8px; font-size:11px; color:#9a8a6a; max-height:64px; overflow-y:auto; line-height:1.5}
/* ---------- modale ---------- */
.overlay{position:absolute; inset:0; background:rgba(0,0,0,.74); display:flex; align-items:center; justify-content:center; z-index:30; padding:20px}
.modal{background:linear-gradient(180deg,#241309,#170c06); border:1px solid var(--gold-d); border-radius:16px; padding:24px; max-width:340px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.6)}
.modal h2{margin:0 0 8px; font-family:var(--display); font-size:22px; color:var(--gold)}
.modal p{color:var(--dim); font-size:14px; line-height:1.55; margin:6px 0 16px}
.modal .score{font-size:15px; margin:10px 0; font-weight:600; color:var(--txt)}
.win{color:#5fd08a}.lose{color:#e0866a}
/* ---------- paysage : plus d'air ---------- */
@media (orientation:landscape) and (max-height:520px){
  #targets{display:none}
  .center .v{font-size:15px}
  #panel{max-height:46vh}
}
.langsel{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.langsel button{padding:5px 10px;font-size:12px;border-radius:16px;background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:600}
.langsel button.on{border-color:var(--gold);color:var(--gold);background:rgba(227,197,101,.12)}
/* ---------- cosmétiques ---------- */
body[data-back="classic"] .card.back{background:repeating-linear-gradient(45deg,#1f6feb,#1f6feb 5px,#144fb0 5px,#144fb0 10px);border:1px solid #0d1117;box-shadow:inset 0 0 0 3px rgba(255,255,255,.14),0 2px 5px rgba(0,0,0,.4)}
body[data-back="dark"] .card.back{background:repeating-linear-gradient(45deg,#2b2b33,#2b2b33 5px,#17171c 5px,#17171c 10px);border:1px solid #000;box-shadow:inset 0 0 0 3px rgba(227,197,101,.25),0 2px 5px rgba(0,0,0,.4)}
body[data-felt="blue"]{--felt-a:#155a7a;--felt-b:#082a3d}
body[data-felt="violet"]{--felt-a:#4a2a6a;--felt-b:#241338}
#btnMenu{position:absolute;top:8px;right:10px;z-index:7;width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.4);border:1px solid var(--gold-d);color:var(--gold);font-size:16px;cursor:pointer;padding:0}
.fs-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.sheet{background:linear-gradient(180deg,#241309,#160b06);border:1px solid var(--gold-d);border-radius:16px;
  padding:20px;max-width:360px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.sheet h2{font-family:var(--display);color:var(--gold);margin:0 0 12px;font-size:20px}
.sheet h3{font-family:var(--serif);color:var(--txt);margin:16px 0 6px;font-size:14px}
.sheet p,.sheet li{color:var(--dim);font-size:13px;line-height:1.5}
.sheet .opt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.sheet .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:10px}
.sheet .opt button.on{border-color:var(--gold);color:var(--gold);background:rgba(227,197,101,.12)}
/* ---------- animations ---------- */
#trick .card{transition:transform .45s ease-in, opacity .45s ease-in}
#trick.to-N .card{transform:translateY(-150px) scale(.5)!important;opacity:0}
#trick.to-S .card{transform:translateY(160px) scale(.5)!important;opacity:0}
#trick.to-E .card{transform:translateX(170px) scale(.5)!important;opacity:0}
#trick.to-W .card{transform:translateX(-170px) scale(.5)!important;opacity:0}
.card.dealt{animation:dealIn .38s ease-out both}
@keyframes dealIn{from{translate:0 -150px;opacity:0}to{translate:0 0;opacity:1}}
#trickToast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;
  font-family:var(--display);font-weight:800;font-size:22px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.8);
  opacity:0;transition:opacity .2s}
#trickToast.show{opacity:1}
.card.hinted{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(227,197,101,.9)!important;translate:0 -12px;z-index:98!important}
</style>
</head>

function beep(f,dur,type,vol,delay){ if(!SOUND||!AC) return; try{
  const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(vol||0.07,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.03);
}catch(e){} }

const nextSeat = s => (s+1)%4;
const teamOf = s => (s%2===0) ? 'NS' : 'EW';   // 0,2 -> NS ; 1,3 -> EW

const cardKey = c => c.s + c.r;
const cardValue = c => VALUE[c.r];
function buildDeck(){
  const d=[]; for(const s of SUITS) for(const r of RANKS) d.push({s,r}); return d;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
// force d'une carte dans un pli, donné l'atout et la couleur menée
function trickStrength(card,trumpSuit,ledSuit){
  if(card.s===trumpSuit) return 200+STRENGTH[card.r];
  if(card.s===ledSuit)   return 100+STRENGTH[card.r];
  return STRENGTH[card.r];
}

class Engine{
  constructor(){
    this.tokens={NS:11,EW:11};
    this.dealer=Math.floor(Math.random()*4);
    this.currentTrick=[]; this.ledSuit=null; this.tricks=[]; this.seen=new Set();
  }
  // ---- nouvelle donne : 1er temps, 4 cartes chacun ----------------------
  newHand(){
    this.deck=shuffle(buildDeck());
    this.hands=[[],[],[],[]];
    this.dealt=0;
    this.dealBatch();                       // 1er temps : 4 cartes chacun
    this.trumpSuit=null; this.trumpMaker=null;
    this.trumpMaker1=null; this.bid1=null;
    this.indicator=null; this.indicatorOnTable=true;
    this.bid=null; this.trumpOpen=false;
    this.pcc=false; this.soloMode=false; this.mutedSeat=null;   // Partner Close Caps
    this.tricks=[]; this.trickWinsNS=0; this.trickWinsEW=0; this.trumpsPlayed=0; this.spoilt=false; this.seen=new Set(); this.currentTrick=[]; this.ledSuit=null;
    this.pointsNS=0; this.pointsEW=0;
    this.eldest=nextSeat(this.dealer);      // droite du donneur = parle en 1er
    this.phase='redeal';                    // on vérifie d'abord le redeal éventuel
    // enchères — 1er tour
    this.bidTurn=this.eldest;
    this.highBid=null; this.highBidder=null;
    this.passStreak=0; this.spoken=new Set();
    return {phase:'redeal'};
  }
  dealBatch(){ // donne 4 cartes chacun en partant de la droite du donneur
    for(let k=0;k<4;k++){
      for(let n=0;n<4;n++){
        const seat=(this.dealer+1+n)%4;
        this.hands[seat].push(this.deck[this.dealt++]);
      }
    }
    for(const h of this.hands) sortHand(h);

  placeBid2(value){ // value=null => pass ; nombre ; ou 'PCC' ; un seul tour de table

      if(seat===this.trumpMaker && this.trumpOpen && this.trumpSuit){

  // ATOUT GÂCHÉ : les deux adversaires du preneur n'ont aucun atout -> donne annulée
  _checkSpoilt(){

    this.tricks.push(res);
    this.log(`Pli ${this.tricks.length} : ${SEAT_NAME[win.seat]} remporte (${pts} pts)`+(reveal?' — atout révélé !':''));
    // règle des enchères >= 250 : l'atout est révélé après le 1er pli
    if(!this.trumpOpen && (this.pcc || this.bid>=250) && this.tricks.length===1){

      this.trumpOpen=true; res.reveal250=true;

    }

    this.leader=win.seat; this.turn=win.seat;
    this.currentTrick=[]; this.ledSuit=null;

  scoreHand(res){
    this.phase='scored';

    if(this.pcc){
      const wins = tmTeam==='NS'?this.trickWinsNS:this.trickWinsEW;
      const success = wins===8;
      const transfer = success?4:5;
      if(success){ this.tokens[tmTeam]+=transfer; this.tokens[other]-=transfer; }
      else       { this.tokens[tmTeam]-=transfer; this.tokens[other]+=transfer; }
      this.tokens.NS=Math.max(0,Math.min(22,this.tokens.NS));
      this.tokens.EW=Math.max(0,Math.min(22,this.tokens.EW));
      res.score={tmTeam,pcc:true,tricks:wins,bid:'Partner Close Caps',success,transfer,caps:success};
      res.gameOver = this.tokens.NS<=0 || this.tokens.EW<=0;
      if(res.gameOver) res.gameWinner = this.tokens.NS<=0 ? 'EW':'NS';
      this.dealer=nextSeat(this.dealer);
      return res;
    }

    const success = tmPoints>=this.bid;
    // barème
    let delta;
    if(this.bid<200) delta=success?1:-2;
    else if(this.bid<250) delta=success?2:-3;
    else delta=success?3:-4;
    // Caps (8 plis) : +1 bonus (simplifié)
    const capsNS=this.trickWinsNS===8, capsEW=this.trickWinsEW===8;
    let capsBonus=0;
    if((tmTeam==='NS'&&capsNS)||(tmTeam==='EW'&&capsEW)) capsBonus=1;
    // transfert de jetons
    let transfer = success ? Math.abs(delta)+capsBonus : Math.abs(delta);
    if(success){ this.tokens[tmTeam]+=transfer; this.tokens[other]-=transfer; }
    else       { this.tokens[tmTeam]-=transfer; this.tokens[other]+=transfer; }
    this.tokens.NS=Math.max(0,Math.min(22,this.tokens.NS));
    this.tokens.EW=Math.max(0,Math.min(22,this.tokens.EW));
    res.score={tmTeam,tmPoints,bid:this.bid,success,transfer,caps:capsBonus>0};
    res.gameOver = this.tokens.NS<=0 || this.tokens.EW<=0;
    if(res.gameOver) res.gameWinner = this.tokens.NS<=0 ? 'EW':'NS';
    // le donneur passe à droite
    this.dealer=nextSeat(this.dealer);
    return res;
  }
  log(m){ (this._log=this._log||[]).push(m); if(this.onLog)this.onLog(m); }
}
function sortHand(h){
  h.sort((a,b)=> a.s!==b.s ? SUITS.indexOf(a.s)-SUITS.indexOf(b.s) : STRENGTH[b.r]-STRENGTH[a.r]);
}

/* ============================================================================
   IA SIMPLE POUR LES BOTS
============================================================================ */
// Estimation des points que l'équipe réalisera, à partir des 4 premières cartes.
// Modèle calibré sur 40 000 donnes simulées : la STRUCTURE compte plus que le total.
function est4(h){
  const bySuit={}; for(const c of h)(bySuit[c.s]=bySuit[c.s]||[]).push(c);
  let best=null,bs=-1;
  for(const s in bySuit){ const cs=bySuit[s]; const sc=cs.reduce((a,c)=>a+cardValue(c),0)+cs.length*2; if(sc>bs){bs=sc;best=s;} }
  const tr=bySuit[best]; const pts=h.reduce((a,c)=>a+cardValue(c),0);
  return 124.8 + 0.09*pts + 13.6*tr.length
       + 26.7*(tr.some(c=>c.r==='J')?1:0) + 9.2*(tr.some(c=>c.r==='9')?1:0)
       + 20.7*h.filter(c=>c.r==='J'&&c.s!==best).length;
}
function botBid(engine,seat){
  const legal=engine.legalBids(); if(!legal.length) return null;
  const est=est4(engine.hands[seat]);
  // seuils choisis par duel (97 % de victoires contre l'ancienne IA d'enchères)
  let target = est>=210?190 : est>=195?180 : est>=185?170 : est>=160?160 : 0;
  if(!target) return null;
  const partnerLeads=engine.highBidder!==null && teamOf(engine.highBidder)===teamOf(seat);
  if(partnerLeads) target = est>=230?200:0;          // ne pas surenchérir son partenaire sans main énorme
  const opts=legal.filter(b=>b<=target);
  return opts.length?opts[opts.length-1]:null;
}
function botBid2(engine,seat){
  // 2e tour : très prudent, on ne monte à 250+ qu'avec une main quasi imbattable
  const legal=engine.legalBids2(); const canPcc=engine.canPCC();
  const h=engine.hands[seat];
  const bySuit={}; for(const c of h){ (bySuit[c.s]=bySuit[c.s]||[]).push(c); }
  let bestLen=0,bestSuit='S';
  for(const s of SUITS){ const arr=bySuit[s]||[]; if(arr.length>bestLen){bestLen=arr.length;bestSuit=s;} }
  const tr=bySuit[bestSuit]||[];
  const hasJ=tr.some(c=>c.r==='J'), has9=tr.some(c=>c.r==='9');
  const pts=h.reduce((a,c)=>a+cardValue(c),0);
  // Partner Close Caps : seulement une main monstrueuse (quasi jamais)
  if(canPcc && bestLen>=7 && hasJ && has9 && pts>=200) return 'PCC';
  if(legal.length && bestLen>=5 && hasJ && has9 && pts>=150 && legal.includes(250)) return 250;
  return null; // pass
}
function botChooseTrump(engine,seat){
  // couleur où le bot est le plus fort (points + présence J/9)
  const h=engine.hands[seat]; let best='S',bestScore=-1;
  for(const s of SUITS){
    const cards=h.filter(c=>c.s===s);
    const sc=cards.reduce((a,c)=>a+cardValue(c),0)+cards.length*2;
    if(sc>bestScore){bestScore=sc;best=s;}
  }
  // pose comme indicator une carte faible de cette couleur (garde les fortes en main)
  const inSuit=h.filter(c=>c.s===best).sort((a,b)=>STRENGTH[a.r]-STRENGTH[b.r]);
  return inSuit[0] || h[0];
}
// Carte « maître » : aucune carte plus forte de sa couleur n'est encore inconnue
// (connue = déjà vue en public, dans ma main, ou visible dans le pli en cours).
const byStrAsc=(a,b)=>STRENGTH[a.r]-STRENGTH[b.r];   // ordre de force = ordre de valeur au 304
// ----- mémoire : cartes plus fortes de la même couleur encore invisibles -----
function unseenHigher(e,seat,card){
  const mine=new Set(e.hands[seat].map(cardKey));
  const inTrick=new Set(e.currentTrick.filter(x=>!x.faceDown||e.trumpOpen).map(x=>cardKey(x.card)));
  let n=0;
  for(const r of RANKS){ if(STRENGTH[r]>STRENGTH[card.r]){ const k=card.s+r;
    if(!e.seen.has(k)&&!mine.has(k)&&!inTrick.has(k)) n++; } }
  return n;
}
const isMaster=(e,s,c)=>unseenHigher(e,s,c)===0;
function trumpsOut(e,seat){ // atouts encore chez les autres (estimation publique)
  if(!e.trumpSuit) return 8;
  let seenT=0; for(const k of e.seen) if(k[0]===e.trumpSuit) seenT++;
  return 8-seenT-e.hands[seat].filter(c=>c.s===e.trumpSuit).length;
}
function botPlay(engine,seat){
  const e=engine, legal=e.playableCards(seat);
  const led=e.ledSuit, trump=e.trumpSuit, tk=e.currentTrick;
  const isTM=seat===e.trumpMaker;
  const asc=(a,b)=>STRENGTH[a.r]-STRENGTH[b.r];
  const pot=tk.reduce((a,x)=>a+cardValue(x.card),0);
  const last = tk.length===e.trickSize-1;

  // ---- ENTAME ----
  if(tk.length===0){
    // preneur, atout ouvert, maître à l'atout et atouts adverses dehors -> il tire
    if(isTM && e.trumpOpen && trump){
      const mt=legal.filter(c=>c.s===trump && isMaster(e,seat,c)).sort((a,b)=>STRENGTH[b.r]-STRENGTH[a.r]);
      if(mt.length && trumpsOut(e,seat)>0) return mt[0];
    }
    const nonTrump=legal.filter(c=>c.s!==trump);
    // une carte MAÎTRE avec des points : on l'encaisse
    const masters=nonTrump.filter(c=>isMaster(e,seat,c)).sort((a,b)=>cardValue(b)-cardValue(a));
    if(masters.length && cardValue(masters[0])>0) return masters[0];
    // sinon une petite carte sans points
    const pool=(nonTrump.length?nonTrump:legal).slice().sort(asc);
    const zero=pool.find(c=>cardValue(c)===0);
    return zero||pool[0];
  }

  // force actuelle du pli (cartes visibles)
  let bestStr=-1,bestSeat=null,bestCard=null;
  for(const x of tk){ if(!x.faceDown||e.trumpOpen){ const st=trickStrength(x.card,trump,led);
    if(st>bestStr){bestStr=st;bestSeat=x.seat;bestCard=x.card;} } }
  const partnerWinning = bestSeat!==null && teamOf(bestSeat)===teamOf(seat);
  const partnerSafe = partnerWinning && (last || (bestCard && isMaster(e,seat,bestCard) && bestCard.s===led));

  // ---- JE PEUX SUIVRE ----
  if(legal.some(c=>c.s===led)){
    const follow=legal.filter(c=>c.s===led).sort(asc);
    if(partnerWinning){
      // partenaire assuré de gagner : on lui donne des points ; sinon on reste petit
      if(partnerSafe && !(!e.trumpOpen && e.trumpMaker!==null && teamOf(e.trumpMaker)!==teamOf(seat) && !last))
        return follow.slice().sort((a,b)=>cardValue(b)-cardValue(a))[0];
      return follow[0];
    }
    const winners=follow.filter(c=>trickStrength(c,trump,led)>bestStr);
    if(!winners.length) return follow[0];
    if(last) return winners[0];                                  // dernier : plus petite gagnante
    const mw=winners.filter(c=>isMaster(e,seat,c));
    if(mw.length) return mw[0];                                  // gagnante sûre
    return (pot>=10) ? winners[0] : follow[0];
  }

  // ---- JE NE PEUX PAS SUIVRE ----
  if(e.trumpOpen){
    const trumps=legal.filter(c=>c.s===trump).sort(asc);
    const disc=legal.filter(c=>c.s!==trump);
    if(partnerWinning){
      if(partnerSafe && disc.length) return disc.slice().sort((a,b)=>cardValue(b)-cardValue(a))[0]; // on charge le partenaire
      return disc.length? disc.slice().sort(asc)[0] : trumps[0];
    }
    const w=trumps.filter(c=>trickStrength(c,trump,led)>bestStr);
    if(w.length && (pot>0 || !disc.length)) return w[0];        // coupe minimale si ça rapporte
    return disc.length? disc.slice().sort(asc)[0] : trumps[0];
  }
  // atout FERMÉ, le preneur connaît l'atout
  if(isTM){
    const trumps=e.hands[seat].filter(c=>c.s===trump).sort(asc);
    if(!partnerWinning && trumps.length && pot>=10) return {card:trumps[0]};
    if(!partnerWinning && e.indicatorOnTable && trumps.length===0 && pot>=20) return {indicator:true};
    const disc=e.hands[seat].filter(c=>c.s!==trump).sort(asc);
    return {card: disc[0]||e.hands[seat][0]};
  }
  // défenseur, atout caché : coupe « devinée » si le pli vaut le coup
  const sorted=legal.slice().sort(asc);
  if(!partnerWinning && pot>=13){
    const bySuit={}; for(const c of legal){ if(c.s!==led)(bySuit[c.s]=bySuit[c.s]||[]).push(c); }
    let guess=null,gl=99; for(const su in bySuit){ if(bySuit[su].length<gl){gl=bySuit[su].length;guess=su;} }
    if(guess) return {card: bySuit[guess].sort(asc)[0]};
  }
  return {card: sorted.find(c=>cardValue(c)===0) || sorted[0]};
}

function updScore(){

function setText(sel,v){const e=$(sel); if(e)e.textContent=v;}

function cardDiv(c,{mini,big,cls}={}){
  const d=document.createElement('div');
  const red=(c.s==='D'||c.s==='H');
  d.className='card'+(mini?' mini':'')+(big?' big':'')+(red?' red':'')+(cls?' '+cls:'');
  d.innerHTML=`<span class="r">${c.r}</span><span class="s">${SUIT_SYM[c.s]}</span>`;
  return d;
}
function backDiv(mini){const d=document.createElement('div');d.className='card back'+(mini?' mini':'');return d;}

let _prevLen=[0,0,0,0];
function renderHands(){
  const muted = eng.soloMode?eng.mutedSeat:-1;
  for(let i=0;i<4;i++){
    const seat=seatEl(i), row=seat.querySelector('.handrow'); row.innerHTML='';
    const h=eng.hands[i];
    if(i===0 && i!==muted){
      const myTurn = eng.phase==='play'&&eng.turn===0&&!ANIM;
      const playable = myTurn? eng.playableCards(0).map(cardKey):[];
      const facedownMode = myTurn && eng.currentTrick.length>0 && !eng.trumpOpen && !eng.hands[0].some(c=>c.s===eng.ledSuit);
      const n=h.length, mid=(n-1)/2; let _newIdx=0;
      h.forEach((c,idx)=>{
        const canPlay = myTurn && (facedownMode || playable.includes(cardKey(c)));
        const d=cardDiv(c,{big:true, cls: canPlay?'play':(myTurn?'disabled':'')}); d.dataset.k=cardKey(c);
        const off=idx-mid;
        d.style.transform=`rotate(${(off*4).toFixed(1)}deg) translateY(${Math.round(Math.abs(off)*5)}px)`;
        if(idx) d.style.marginLeft='-16px';
        d.style.zIndex=String(idx);
        if(canPlay) d.onclick=()=>humanPlay(c);
        if(!_prevKeys.has(cardKey(c))){ d.classList.add('dealt'); d.style.animationDelay=(_newIdx++*70)+'ms'; }
        row.appendChild(d);
      });
    } else if(i===muted){
      const cnt=Math.min(h.length,6);
      for(let k=0;k<cnt;k++){const b=backDiv();b.style.opacity='.3';if(k)b.style.marginLeft='-22px';row.appendChild(b);}
    } else {
      const side=(i===1||i===3);
      const cnt=Math.min(h.length,6);
      for(let k=0;k<cnt;k++){const b=backDiv(true);
        if(k){ if(side) b.style.marginTop='-26px'; else b.style.marginLeft='-18px'; }
        row.appendChild(b);}
    }
    // animation de distribution : si la main a grossi, les cartes arrivent une à une
    if(h.length > (_prevLen[i]||0)){
      [...row.children].forEach((el,k)=>{ el.classList.add('dealt'); el.style.animationDelay=(k*45+i*25)+'ms'; });
    }
    _prevLen[i]=h.length;
  }
  for(let i=0;i<4;i++){
    const el=seatEl(i);
    el.classList.toggle('active', (eng.phase==='bid1'&&eng.bidTurn===i)||(eng.phase==='bid2'&&eng.bid2Turn===i)||(eng.phase==='play'&&eng.turn===i));
    el.style.opacity=(i===muted)?'.6':'1';
    const nameEl=el.querySelector('.name'), metaEl=el.querySelector('.meta'), avEl=el.querySelector('.avatar');
    const base=[t('seatYou'),t('seatEast'),t('seatNorth'),t('seatWest')][i];
    if(nameEl) nameEl.textContent=base;
    let meta=(i===0?t('mSud'):i===2?t('mPartner'):t('mAI'));
    if(eng.trumpMaker===i) meta=eng.pcc?t('mSolo'):t('mMaker');
    if(i===muted) meta=t('mOut');
    if(metaEl){ metaEl.textContent=meta; metaEl.className='meta'+(eng.trumpMaker===i?' tm':'')+(i===muted?' out':''); }
    if(avEl) avEl.textContent=AVATAR[i];
  }
}
let _lastTrick=0; let ANIM=false; let _prevKeys=new Set();
function rememberHand(){ _prevKeys=new Set(eng.hands[0].map(cardKey)); }
function renderTrick(){
  document.querySelectorAll('#trick .slot').forEach(s=>s.innerHTML='');
  const t=eng.currentTrick||[];
  t.forEach((x,idx)=>{
    const slot=$('#trick .slot.'+SEAT_LETTER[x.seat]);
    let el;
    if(x.faceDown && !eng.trumpOpen){ el=document.createElement('div'); el.className='card facedown big'; }
    else el=cardDiv(x.card,{big:true});
    if(idx===t.length-1 && t.length>_lastTrick) el.classList.add('enter');
    slot.appendChild(el);
  });
  _lastTrick=t.length;
}
function renderAll(){updScore();renderHands();rememberHand();renderTrick();}

/* ---------- déroulé d'une donne ---------- */
function startHand(){
  _prevLen=[0,0,0,0]; LAST_TRICK=null;
  eng.newHand();
  addLog(`— Nouvelle donne — Donneur : ${SEAT_NAME[eng.dealer]} —`);
  renderAll();
  handleRedeal(0);
}
// REDEAL : joueur à droite du donneur, main < 15 pts
function handleRedeal(safety){
  renderAll();
  if(safety>6){ eng.startBidding1(); return stepBidding(); }   // garde-fou
  if(!eng.canRedeal()){ eng.startBidding1(); return stepBidding(); }
  if(eng.eldest===0){
    setMsgL(()=>tf('weakHand',{n:eng.handPoints(0)}));
    clearControls();
    btn(t('redeal'),'primary',()=>{ eng.redeal(); handleRedeal(safety+1); });
    btn(t('keep'),'',()=>{ eng.startBidding1(); stepBidding(); });
    setHintL(()=>t('redealRight'));
  }else{
    setMsgL(()=>tf('botRedeals',{p:seatName(eng.eldest)})); clearControls();
    setTimeout(()=>{ eng.redeal(); handleRedeal(safety+1); }, D(700));
  }
}
// ---- 1er tour d'enchères ----
function stepBidding(){
  renderAll();
  if(eng.phase==='allpass'){ setMsgL(()=>t('allPass')); clearControls(); setTimeout(startHand,1200); return; }
  if(eng.phase!=='bid1'){ return afterRound1(); }
  const seat=eng.bidTurn;
  if(seat===0){
    const legal=eng.legalBids();
    setMsgL(()=>tf('bid1You',{n:eng.handPoints(0)})+
           (eng.highBid?tf('bestBid',{b:eng.highBid,p:seatName(eng.highBidder)}):t('noBidYet')));
    clearControls();
    legal.forEach(v=>btn(String(v),'',()=>{eng.placeBid(v);nextBid();}));
    btn(t('pass'),'pass',()=>{eng.placeBid(null);nextBid();});
    btn(t('hint'),'',()=>{ const v=botBid(eng,0); setHint(v?tf('hintBid',{b:v}):t('hintPass')); });
    setHintL(()=>t('bid1Hint'));
  }else{
    clearControls(); setHint(''); setMsgL(()=>tf('thinking',{p:seatName(seat)}));
    setTimeout(()=>{ eng.placeBid(botBid(eng,seat)); nextBid(); }, D(600));
  }
}
function nextBid(){
  renderAll();
  if(eng.phase==='allpass'){ setMsgL(()=>t('allPass')); clearControls(); setTimeout(startHand,1200); return; }
  if(eng.phase==='chooseTrump1') return afterRound1();
  stepBidding();
}
// ---- choix atout du 1er tour ----
function afterRound1(){
  renderAll();
  const tm=eng.trumpMaker1;
  if(tm===0){
    setMsgL(()=>t('youWinR1'));
    setHintL(()=>t('trumpTip'));
    humanPickTrump(c=>{ eng.chooseTrump1(c); addLog(`Atout posé (caché).`); startRound2(); });
  }else{
    setMsgL(()=>tf('botSetsTrump',{p:seatName(tm)})); clearControls(); setHint('');
    setTimeout(()=>{ eng.chooseTrump1(botChooseTrump(eng,tm)); startRound2(); }, D(700));
  }
}
// ---- 2e tour d'enchères (8 cartes) ----
function startRound2(){ renderAll(); stepBid2(); }
function stepBid2(){
  renderAll();
  if(eng.phase!=='bid2') return afterRound2();
  const seat=eng.bid2Turn;
  const legal=eng.legalBids2();
  if(seat===0){
    if(!legal.length && !eng.canPCC()){ setMsgL(()=>t('mustPass2')); clearControls(); setHint('');
      setTimeout(()=>{ eng.placeBid2(null); stepBid2(); }, D(700)); return; }
    setMsgL(()=>tf('bid2You',{n:eng.handPoints(0)}));
    clearControls();
    legal.slice(0,5).forEach(v=>btn(String(v),'',()=>{eng.placeBid2(v);stepBid2();}));
    if(eng.canPCC()) btn('Partner Close Caps','gold',()=>{
      if(confirm('Partner Close Caps : vous jouez SEUL contre les deux adversaires et devez gagner les 8 plis. Votre partenaire ne joue pas. Réussi +4 jetons, raté −5. Confirmer ?'))
      { eng.placeBid2('PCC'); stepBid2(); }
    });
    btn(t('pass'),'pass',()=>{eng.placeBid2(null);stepBid2();});
    setHintL(()=>t('bid2Hint'));
  }else{
    clearControls(); setHint(''); setMsgL(()=>tf('botRound2',{p:seatName(seat)}));
    setTimeout(()=>{ eng.placeBid2(botBid2(eng,seat)); stepBid2(); }, D(550));
  }
}
function afterRound2(){
  renderAll();
  if(eng.phase==='chooseTrumpPCC'){
    const tm=eng.trumpMaker;
    if(tm===0){
      setMsgL(()=>t('pccYou'));
      setHintL(()=>t('pccHint'));
      humanPickTrump(c=>{ eng.chooseTrumpPCC(c); startPlay(); });
    }else{
      setMsgL(()=>tf('botPcc',{p:seatName(tm)})); clearControls(); setHint('');
      setTimeout(()=>{ eng.chooseTrumpPCC(botChooseTrump(eng,tm)); startPlay(); }, D(800));
    }
    return;
  }
  if(eng.phase==='chooseTrump2'){
    const tm=eng.trumpMaker;
    if(tm===0){
      setMsgL(()=>t('youTakeR2'));
      setHint(''); humanPickTrump(c=>{ eng.chooseTrump2(c); preplay(); });
    }else{
      setMsgL(()=>tf('botNewTrump',{p:seatName(tm)})); clearControls(); setHint('');
      setTimeout(()=>{ eng.chooseTrump2(botChooseTrump(eng,tm)); preplay(); }, D(700));
    }
  }else{ preplay(); }   // 2e tour : tous passent -> on joue sur le 1er tour
}
// ---- choix jeu ouvert / fermé ----
function preplay(){
  renderAll();
  const tm=eng.trumpMaker;
  if(tm===0){
    setMsgL(()=>t('openOrClosed'));
    clearControls();
    btn(t('closedGame'),'primary',()=>{ eng.startPlayClosed(); startPlay(); });
    btn(t('openGame'),'',()=>{ eng.startPlayOpen(); if(eng.phase==='spoilt'){ setMsgL(()=>t('spoilt')); clearControls(); setTimeout(startHand,1600);} else startPlay(); });
    setHintL(()=>t('openHint'));
  }else{
    // les bots jouent fermé (sauf enchère ≥250 où l\'atout se révèle après le 1er pli de toute façon)
    eng.startPlayClosed(); startPlay();
  }
}
function humanPickTrump(cb){
  clearControls();
  const row=seatEl(0).querySelector('.handrow'); row.innerHTML='';
  const h=eng.hands[0], n=h.length, mid=(n-1)/2;
  h.forEach((c,idx)=>{
    const d=cardDiv(c,{big:true, cls:'play'});
    const off=idx-mid;
    d.style.transform=`rotate(${(off*4).toFixed(1)}deg) translateY(${Math.round(Math.abs(off)*5)}px)`;
    if(idx) d.style.marginLeft='-16px';
    d.style.zIndex=String(idx);
    d.onclick=()=>cb(c);
    row.appendChild(d);
  });
}
function startPlay(){
  renderAll();
  stepPlay();
}
function stepPlay(){
  renderAll();
  if(eng.tricks.length===8){ return; } // fin gérée dans resolveTrick handler
  const seat=eng.turn;
  // preneur avec seulement l'indicator en main (8e pli) : jeu forcé
  if(eng.hands[seat].length===0 && seat===eng.trumpMaker && eng.indicatorOnTable){
    setMsgL(()=>t('lastTrickTM')); clearControls();
    setTimeout(()=>{ const r=eng.playLastIndicator(seat); afterPlay(r); }, D(seat===0?400:620));
    return;
  }
  if(seat===0){
    const facedownMode = eng.currentTrick.length>0 && !eng.trumpOpen && !eng.hands[0].some(c=>c.s===eng.ledSuit);
    if(eng.currentTrick.length===0) setMsgL(()=>t('youLead'));
    else if(facedownMode) setMsgL(()=>t('youFacedown'));
    else setMsgL(()=>t('youFollow'));
    clearControls();
    btn(t('hint'),'',showPlayHint);
    if(LAST_TRICK) btn(t('lastTrickBtn'),'',openLastTrick);
    if(eng.canCutWithIndicator(0)) btn(t('cutIndicator'),'primary',humanCutIndicator);
    setHint(eng.trumpOpen?tf('trumpOpenHint',{s:suitName(eng.trumpSuit)}):t('trumpHiddenHint'));
  }else{
    setMsgL(()=>tf('botPlays',{p:seatName(seat)})); clearControls();
    if(eng.soloMode && eng.mutedSeat===0) setHintL(()=>t('pccOut'));
    setTimeout(()=>botTurn(seat), D(620));
  }
}
function humanPlay(c){
  clearControls();                       // Conseil / Dernier pli disparaissent une fois la carte jouée
  const r=eng.playCard(0,c);
  afterPlay(r);
}
function humanCutIndicator(){
  if(!eng.canCutWithIndicator(0)) return;
  clearControls();
  afterPlay(eng.playIndicatorToCut(0));
}
function botTurn(seat){
  const choice=botPlay(eng,seat);
  let r;
  if(choice && choice.indicator){ r=eng.playIndicatorToCut(seat); }
  else { const card=choice.card||choice; r=eng.playCard(seat,card); }
  afterPlay(r);
}
function renderTrickCards(cards){
  document.querySelectorAll('#trick .slot').forEach(sl=>sl.innerHTML='');
  for(const x of cards){
    const slot=$('#trick .slot.'+SEAT_LETTER[x.seat]);
    const el=(x.faceDown && !eng.trumpOpen) ? Object.assign(document.createElement('div'),{className:'card facedown big'}) : cardDiv(x.card,{big:true});
    slot.appendChild(el);
  }
}
function afterPlay(r){
  if(r && r.trickDone){ SFX.trick(); LAST_TRICK={cards:r.cards,winner:r.winner,points:r.points}; } else if(r) SFX.card();
  renderAll();
  if(r && r.spoilt){ setMsgL(()=>t('spoilt')); clearControls(); setTimeout(startHand,1600); return; }
  if(r && r.trickDone){
    ANIM=true; renderHands();
    renderTrickCards(r.cards); _lastTrick=0;           // le pli COMPLET reste visible
    const name=[t('seatYou'),t('seatEast'),t('seatNorth'),t('seatWest')][r.winner];
    if(r.revealed) setMsgL(()=>t('revealed'));
    else if(r.reveal250) setMsgL(()=>t('reveal250'));
    else setMsg(`${t('trickTo')} <b>${name}</b> (+${r.points})`);
    const toast=$('#trickToast'); if(toast){ toast.textContent='+'+r.points; toast.classList.add('show'); }
    const hold=D((r.revealed||r.reveal250)?1400:850);
    setTimeout(()=>{
      if(toast) toast.classList.remove('show');
      const tr=$('#trick'), cls='to-'+SEAT_LETTER[r.winner];
      tr.classList.add(cls);                            // les cartes filent vers le gagnant
      setTimeout(()=>{
        tr.classList.remove(cls);
        document.querySelectorAll('#trick .slot').forEach(sl=>sl.innerHTML='');
        ANIM=false;
        if(r.handDone) return showHandResult(r);
        stepPlay();
      },470);
    },hold);
  }else{
    stepPlay();
  }
}
function showHandResult(r){
  renderAll();
  const s=r.score;
  const weWon = (s.tmTeam==='NS') === s.success;   // notre équipe est-elle gagnante de la donne ?
  const nsWon = s.success ? s.tmTeam==='NS' : s.tmTeam==='EW';
  bumpStats(nsWon);
  const usTeam='NS';
  const usIsWinner = (nsWon);
  (usIsWinner?SFX.win:SFX.lose)();
  const ov=document.createElement('div'); ov.className='overlay';
  const gameOver=r.gameOver;
  ov.innerHTML=`<div class="modal">
    <h2>${usIsWinner?'<span class="win">'+t('dealWon')+'</span>':'<span class="lose">'+t('dealLost')+'</span>'}</h2>
    <p>${t('makerLabel')} : <b>${SEAT_NAME[eng.trumpMaker!==null?eng.trumpMaker:0]}</b> (${s.tmTeam==='NS'?t('us'):t('them')})<br>
       ${s.pcc
         ? `<b>Partner Close Caps</b> · ${s.tricks}/8 plis — ${s.success?'<span class="win">'+t('succeeded')+'</span>':'<span class="lose">'+t('failedPcc')+'</span>'}`
         : `Enchère <b>${s.bid}</b> · réalisé <b>${s.tmPoints}</b> pts — ${s.success?'<span class="win">'+t('succeeded')+'</span>':'<span class="lose">'+t('failedBid')+'</span>'}${s.caps?' · <b>'+t('caps')+'</b>':''}`}</p>
    <div class="score">${t('tokens')} — ${t('us')} <b>${eng.tokens.NS}</b> · ${t('them')} <b>${eng.tokens.EW}</b> <span style="color:var(--dim)">(${s.success?'+':'−'}${s.transfer})</span></div>
    ${gameOver?`<p style="font-size:16px;color:${r.gameWinner==='NS'?'var(--green)':'var(--red)'}"><b>${r.gameWinner==='NS'?t('gameWon'):t('gameLost')}</b></p>`:''}
    <button class="primary" id="cont">${gameOver?t('playAgain'):t('nextDeal')}</button>
  </div>`;
  $('#table').appendChild(ov);
  $('#cont').onclick=()=>{
    ov.remove();
    if(gameOver){ eng=new Engine(); eng.onLog=addLog; }
    startHand();
  };
}

  document.querySelectorAll('#setFelts button').forEach(b=>b.classList.toggle('on', b.dataset.v===(localStorage.getItem('felt304')||'green')));

  document.querySelectorAll('#setSpeed button').forEach(b=>b.classList.toggle('on', parseFloat(b.dataset.v)===SPEED));
}

// ---- 💡 Conseil pendant le jeu : met en valeur la carte que jouerait l'IA ----
function showPlayHint(){
  if(eng.phase!=='play' || eng.turn!==0 || !eng.hands[0].length) return;
  const ch=botPlay(eng,0);
  if(!ch) return;
  if(ch && ch.indicator){ setHintL(()=>t(eng.canCutWithIndicator(0)?'hintCut':'hintDiscard')); return; }
  const c=(ch&&ch.card)||ch;
  document.querySelectorAll('#seat-S .card.hinted').forEach(el=>el.classList.remove('hinted'));
  const el=document.querySelector('#seat-S .handrow [data-k="'+cardKey(c)+'"]');
  if(el) el.classList.add('hinted');
  setHintL(()=>t('hintPlay'));
}
// ---- Dernier pli ----
function openLastTrick(){
  if(!LAST_TRICK) return;
  const L=LAST_TRICK, ov=document.createElement('div'); ov.className='fs-overlay';
  ov.innerHTML=`<div class="sheet" style="text-align:center"><h2>${tf('lastTrickTitle',{p:[t('seatYou'),t('seatEast'),t('seatNorth'),t('seatWest')][L.winner],n:L.points})}</h2>
    <div id="ltRow" style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0"></div>
    <button class="primary" onclick="this.closest('.fs-overlay').remove()">${t('close')}</button></div>`;
  document.body.appendChild(ov);
  const row=ov.querySelector('#ltRow');
  for(const x of L.cards){
    const cell=document.createElement('div'); cell.style.cssText='display:flex;flex-direction:column;align-items:center;gap:4px';
    const lab=document.createElement('div'); lab.style.cssText='font-size:11px;color:var(--dim)';
    lab.textContent=[t('seatYou'),t('seatEast'),t('seatNorth'),t('seatWest')][x.seat];
    let c;
    if(x.faceDown && !eng.trumpOpen && x.seat!==0){ c=document.createElement('div'); c.className='card facedown big'; }
    else c=cardDiv(x.card,{big:true});
    if(x.seat===L.winner) c.style.boxShadow='0 0 0 3px var(--gold)';
    cell.appendChild(lab); cell.appendChild(c); row.appendChild(cell);
  }
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
}
function openTutorial(){
  const FR=`<h2>Apprendre le 304</h2>
    <h3>But du jeu</h3>
    <p>4 joueurs, 2 équipes (vous + Nord contre Est + Ouest). On enchérit des points, puis on tente de les réaliser en remportant des plis. Chaque donne transfère des jetons ; l'équipe qui rafle tous les jetons de l'autre gagne.</p>
    <h3>Les cartes (32) et leurs points</h3>
    <ul><li><b>Valet</b> = 30 (la plus forte)</li><li><b>9</b> = 20</li><li><b>As</b> = 11 · <b>10</b> = 10 · <b>Roi</b> = 3 · <b>Dame</b> = 2 · <b>8</b>/<b>7</b> = 0</li></ul>
    <p>Total : <b>304 points</b>. Hiérarchie : V &gt; 9 &gt; As &gt; 10 &gt; R &gt; D &gt; 8 &gt; 7.</p>
    <h3>Déroulé</h3>
    <p>4 cartes → 1er tour d'enchères (min 160) → le gagnant pose l'<b>atout</b> face cachée → 4 cartes de plus → 2e tour possible (≥250) → <b>jeu fermé/ouvert</b> → 8 plis.</p>
    <h3>Atout caché</h3>
    <p>Suivez la couleur demandée si possible. Sinon, posez une carte <b>face cachée</b> en pariant sur l'atout pour couper. Le preneur révèle si l'une est atout.</p>
    <h3>Partner Close Caps</h3>
    <p>L'enchère max : jouer <b>seul</b> et gagner les <b>8 plis</b>. +4 jetons si réussi, −5 sinon.</p>
    <h3>Marquer</h3>
    <p>Enchère atteinte → jetons gagnés (&lt;200 : +1 · 200-249 : +2 · ≥250 : +3 · les 8 plis « Caps » : +1). Sinon perdus.</p>`;
  const EN=`<h2>Learn 304</h2>
    <h3>Goal</h3>
    <p>4 players, 2 teams (you + North vs East + West). Bid for points, then try to make them by winning tricks. Each deal transfers tokens; the team that takes all the other's tokens wins.</p>
    <h3>The 32 cards & their points</h3>
    <ul><li><b>Jack</b> = 30 (highest)</li><li><b>9</b> = 20</li><li><b>Ace</b> = 11 · <b>10</b> = 10 · <b>King</b> = 3 · <b>Queen</b> = 2 · <b>8</b>/<b>7</b> = 0</li></ul>
    <p>Total: <b>304 points</b>. Order: J &gt; 9 &gt; A &gt; 10 &gt; K &gt; Q &gt; 8 &gt; 7.</p>
    <h3>Flow</h3>
    <p>4 cards → round 1 bidding (min 160) → winner sets the <b>trump</b> face down → 4 more cards → optional round 2 (≥250) → <b>closed/open</b> game → 8 tricks.</p>
    <h3>Hidden trump</h3>
    <p>Follow the led suit if you can. Otherwise play a <b>face-down</b> card, betting on the trump to cut. The declarer reveals if one is a trump.</p>
    <h3>Partner Close Caps</h3>
    <p>The top bid: play <b>solo</b> and win all <b>8 tricks</b>. +4 tokens if made, −5 if not.</p>
    <h3>Scoring</h3>
    <p>Bid made → tokens won (&lt;200: +1 · 200-249: +2 · ≥250: +3 · all 8 tricks "Caps": +1). Otherwise lost.</p>`;
  const done = LANG==='fr' ? 'Compris !' : 'Got it!';
  const ov=document.createElement('div'); ov.className='fs-overlay';
  ov.innerHTML=`<div class="sheet">${LANG==='fr'?FR:EN}
    <div style="margin-top:16px"><button class="primary" onclick="this.closest('.fs-overlay').remove()">${done}</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
}
