<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="304, the trick-taking card game from Jaffna — play against bots or with friends (FR, EN, தமிழ், සිංහල). No real money.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="304">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>304 — Jaffna card game</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#0D1117;margin:0">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Installer l'appli (Chrome, Edge, Android) : l'invitation du navigateur
    // est gardée pour le bouton « Installer » de l'accueil (lib/pwa_web.dart).
    window.__pwa = { prompt: null };
    addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwa.prompt = e;
    });
    addEventListener('appinstalled', function () { window.__pwa.prompt = null; });
    window.pwaCanInstall = function () { return !!window.__pwa.prompt; };
    window.pwaInstall = function () {
      var p = window.__pwa.prompt;
      if (!p) return Promise.resolve(false);
      window.__pwa.prompt = null;
      p.prompt();
      return p.userChoice.then(function (r) { return r.outcome === 'accepted'; });
    };
    window.pwaStandalone = function () {
      return matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone === true;
    };
    // jouable sans internet (partie solo) : web/sw.js
    if ('serviceWorker' in navigator) {
      addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
